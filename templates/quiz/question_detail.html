{% extends "base.html" %}
{% block content %}


<h3>{{ question.content }}</h3>
{% if base.media %}
    <img src="{{question.media.url}}" width="200"/>
{% endif %}


<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-secondary">Наступне запитанння</button>
</form>

{% endblock %}
