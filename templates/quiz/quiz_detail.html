{% extends "base.html" %}
{% block content %}



    <h3> {{ quiz.description }} </h3>
    <br>

<ol>
    {% for question in quiz.questions.all %}

    <h4> <li> {{ question.content }} </h4>
    <img src="{{question.media.url}}" width="200"/>

<ol>
        {% for answer in question.answers.all %}

    <h4> <li> {{ answer.content }} </h4>

    {% endfor %}
</ol>


    {% endfor %}
</ol>

{% endblock %}
